events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=spire_auth:10m rate=5r/s;

    server {
        listen 80;
        server_name spirerace.xyz;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name spirerace.xyz;

        ssl_certificate /etc/nginx/tls/spirerace.xyz_bundle.crt;
        ssl_certificate_key /etc/nginx/tls/spirerace.xyz.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /v1/auth/steam {
            limit_req zone=spire_auth burst=10 nodelay;
            proxy_pass http://server:8080;
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass http://server:8080;
            include /etc/nginx/proxy_params;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }
    }
}
